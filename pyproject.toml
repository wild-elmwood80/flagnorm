[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagnorm"
version = "0.1.0"
description = "Normalize messy feature flag keys and values into a canonical form"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "wild-elmwood80" }]

[tool.setuptools.packages.find]
include = ["flagnorm*"]
